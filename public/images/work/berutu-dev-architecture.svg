<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <style>
      .title { fill: #e2e8f0; font: 700 38px Inter, Arial, sans-serif; }
      .subtitle { fill: #94a3b8; font: 500 20px Inter, Arial, sans-serif; }
      .sectionTitle { fill: #cbd5e1; font: 700 24px Inter, Arial, sans-serif; }
      .node { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 14; ry: 14; }
      .nodeText { fill: #e2e8f0; font: 600 21px Inter, Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #38bdf8; stroke-width: 3; marker-end: url(#arrow); }
      .panel { fill: #0f172a; stroke: #334155; stroke-width: 2; rx: 14; ry: 14; }
      .bullet { fill: #94a3b8; font: 500 20px Inter, Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)" />
  <text x="72" y="84" class="title">berutu.dev Architecture</text>
  <text x="72" y="116" class="subtitle">Request flow from browser to app container</text>
  <text x="72" y="166" class="sectionTitle">Request Flow</text>

  <rect x="72" y="196" width="180" height="84" class="node" />
  <text x="162" y="238" class="nodeText">User Browser</text>

  <rect x="292" y="196" width="200" height="84" class="node" />
  <text x="392" y="238" class="nodeText">Cloudflare DNS</text>

  <rect x="532" y="196" width="180" height="84" class="node" />
  <text x="622" y="238" class="nodeText">Hetzner VPS</text>

  <rect x="752" y="196" width="220" height="84" class="node" />
  <text x="862" y="238" class="nodeText">Caddy Reverse Proxy</text>

  <rect x="1012" y="196" width="200" height="84" class="node" />
  <text x="1112" y="230" class="nodeText">Docker Container</text>
  <text x="1112" y="250" class="nodeText">berutu-portfolio</text>

  <line x1="252" y1="238" x2="292" y2="238" class="line" />
  <line x1="492" y1="238" x2="532" y2="238" class="line" />
  <line x1="712" y1="238" x2="752" y2="238" class="line" />
  <line x1="972" y1="238" x2="1012" y2="238" class="line" />

  <text x="72" y="348" class="sectionTitle">Infrastructure Responsibilities</text>
  <rect x="72" y="374" width="1140" height="290" class="panel" />

  <text x="112" y="434" class="bullet">• Porkbun: Domain registrar</text>
  <text x="112" y="482" class="bullet">• Cloudflare: DNS provider</text>
  <text x="112" y="530" class="bullet">• Hetzner CPX12: VPS hosting</text>
  <text x="112" y="578" class="bullet">• Docker Compose: application deployment</text>
  <text x="112" y="626" class="bullet">• Caddy: reverse proxy and HTTPS termination</text>
</svg>
